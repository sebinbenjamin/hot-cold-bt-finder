<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10131A">
<title>Hot Cold — Bluetooth finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="js/app.js" defer></script>
</head>
<body>

<header>
  <h1>Field Meter</h1>
  <div class="status"><span class="lamp" id="lamp"></span><span class="eyebrow" id="statusText">Idle</span></div>
</header>

<main>

<!-- ============ VIEW: LIST ============ -->
<section class="view active" id="viewList">
  <p class="hint" id="hint">Tap a device to start hunting it.</p>

  <div class="btn-row">
    <button id="btnScan">Start scan</button>
    <button id="btnPick" class="quiet">Add a device by hand</button>
  </div>

  <div class="filter">
    <input id="q" type="search" inputmode="search" autocomplete="off"
           placeholder="Filter by name or id" aria-label="Filter devices by name or id">
    <button id="btnNamed" class="quiet chip" aria-pressed="false">Named only</button>
  </div>
  <div class="eyebrow count" id="count"></div>

  <ul id="list"></ul>
  <div class="empty" id="empty">Nothing yet.</div>

  <div class="note" id="support"></div>
</section>

<!-- ============ VIEW: HUNT ============ -->
<section class="view" id="viewHunt">
  <div class="target">
    <div class="eyebrow">Hunting</div>
    <div class="name" id="targetName">—</div>
  </div>

  <div class="gauge-wrap">
    <div class="glow" id="glow"></div>
    <svg class="gauge" viewBox="0 0 400 190" role="img" aria-label="Signal strength meter">
      <path class="arc-bg" d="M 40 168 A 160 160 0 0 1 360 168"/>
      <path class="arc-fill" id="arcFill" d="M 40 168 A 160 160 0 0 1 360 168"/>
      <g id="ticks"></g>
      <text class="scale-label" x="34" y="186" text-anchor="start">far</text>
      <text class="scale-label" x="366" y="186" text-anchor="end">here</text>
      <line class="needle" id="needle" x1="200" y1="168" x2="200" y2="38"/>
      <circle class="pivot" cx="200" cy="168" r="6"/>
    </svg>
  </div>

  <div class="readout">
    <span class="big mono" id="rssiVal">--</span><span class="unit mono">dBm</span>
    <div class="sub" id="distVal">waiting for a signal</div>
  </div>

  <div class="verdict" id="verdict">
    <div class="word" id="verdictWord">Hold still</div>
    <div class="why" id="verdictWhy">Building a baseline</div>
  </div>

  <canvas id="trace"></canvas>
  <div class="trace-cap">
    <span class="eyebrow">60 seconds ago</span>
    <span class="eyebrow">now</span>
  </div>

  <div class="toggles">
    <button id="btnSound" aria-pressed="true" class="quiet">Sound on</button>
    <button id="btnBuzz" aria-pressed="true" class="quiet">Buzz on</button>
  </div>

  <button id="btnBack" class="quiet">Back to list</button>

  <div class="note">
    Stand still, then walk ten steps one way. Faster clicks mean closer.
    If it slows, turn around.
  </div>
</section>

</main>

</body>
</html>
